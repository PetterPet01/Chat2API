[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepseek-python-api"
version = "0.1.0"
description = "Standalone OpenAI-compatible Python proxy for DeepSeek's web chat API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Chat2API Team" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx[http2]>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "wasmtime>=35,<40",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]
signup = [
  "seleniumbase>=4.30,<5",
  "requests>=2.28,<3",
]

[project.scripts]
deepseek-python-api = "deepseek_python_api.__main__:main"
deepseek-python-api-benchmark = "deepseek_python_api.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_python_api"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/Dockerfile",
  "/.env.example",
]

[tool.hatch.build]
include = [
  "src/deepseek_python_api/**/*.py",
  "src/deepseek_python_api/py.typed",
  "src/deepseek_python_api/assets/*.wasm",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["deepseek_python_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/deepseek_python_api/app.py" = ["B008"]
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deepseek_python_api"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "wasmtime.*"
ignore_missing_imports = true
